# Parameters

# Needed for fast5 input
fast5: "/no_backup/enovoa/nextflow_outputs/Yeast_Ime4KO_2024/RNA002/human_m6A_model/fast5_files/KO2/*.fast5"
## This can be empty but then you need to add specify kit and flowcell via command line inside pars_tools
conffile: ""
## Can be wither guppy or dorado
basecalling: "guppy"
## Can be OFF / cuda10 / cuda11. Newer version of GUPPY may require cuda11
GPU: "cuda11"
demultiplexing: "NO"
demulti_fast5: "NO"
### Number of fast5 basecalled per parallel job
granularity: 5
### File with the list of accepted barcodes. It can be empty
barcodes: ""

# Needed for fastq input
fastq: ""

# Common
reference: "/no_backup/enovoa/reference_fasta/SK1_/Yeast_sk1.fa"
## Can be transcriptome / genome
ref_type: "genome"
annotation: "/no_backup/enovoa/reference_fasta/SK1_/anotation_from_james_Robinson_IGV_2017/sk1.gff3"
## command line options
pars_tools: "tool_opts/drna_tool_seqtaggerbc4RNA002_m6Ayeast_splice_opt.tsv"
## Cut off quality for QC
qualityqc: 5
## Can be nanoq / nanofilt
filtering: "NO"
## Can be graphmap / graphmap2 / minimap2 / bwa
mapping: "NO"
## Can be nanocount for transcriptome / htseq for genome
counting: "NO"
## Can be NO / bambu / isoquant
discovery: "NO"
## Convert bam to cram
cram_conv: "NO"
subsampling_cram: 50
hook: ""
email: ""
output: "/no_backup/enovoa/nextflow_outputs/Yeast_Ime4KO_2024/RNA002/yeast_m6A_model/KO2"
